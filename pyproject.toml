[project]
name = "pie-bench"
version = "0.1.0"
description = "Mac-only inference benchmarks for pie against other local engines"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
]

[project.scripts]
pie-bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bench", "tools"]
