# Models under test. `weights` maps each engine's format to the checkpoint it
# loads, so every engine runs its own copy of the same model. A format left out
# means that engine does not run this model. `params_b` / `active_b` are billions
# of total and active parameters; `fits_gib` is the rough 4-bit resident size.
models:
