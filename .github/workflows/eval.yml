name: eval

on:
  workflow_dispatch:
    inputs:
      macs:
        description: Comma-separated Mac ids, or "all"
        default: all
      engine:
        description: One engine id, or "all"
        default: all
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: eval
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      macs: ${{ steps.pick.outputs.macs }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          ids = [m["id"] for m in yaml.safe_load(open("matrix/macs.yaml"))["macs"]]
          want = os.environ["MACS"].strip()
          if want and want != "all":
              wanted = {w.strip() for w in want.split(",")}
              ids = [i for i in ids if i in wanted]
          print("macs=" + json.dumps(ids))
          PY
        env:
          MACS: ${{ github.event.inputs.macs || 'all' }}

  measure:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        mac: ${{ fromJSON(needs.plan.outputs.macs) }}
    runs-on: [self-hosted, macos, "${{ matrix.mac }}"]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          uv venv
          uv pip install -e .
      - name: Run benchmarks
        run: |
          ARGS="--mac ${{ matrix.mac }}"
          [ "${{ github.event.inputs.engine || 'all' }}" != "all" ] && ARGS="$ARGS --engine ${{ github.event.inputs.engine }}"
          .venv/bin/pie-bench run $ARGS
        env:
          PIE_ROOT: ${{ github.workspace }}/../pie
      - uses: actions/upload-artifact@v4
        with:
          name: records-${{ matrix.mac }}
          path: store/records/**/*.parquet
          if-no-files-found: ignore

  collect:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: records-*
          merge-multiple: true
      - name: Merge results into the store
        run: |
          if [ -d incoming ]; then
            rsync -a incoming/ store/records/ 2>/dev/null || cp -R incoming/. store/records/ 2>/dev/null || true
          fi
      - uses: astral-sh/setup-uv@v4
      - name: Rebuild site data
        run: |
          uv venv
          uv pip install -e .
          .venv/bin/python -m tools.export
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store site/data/db.js
          git diff --cached --quiet || git commit -m "store: results $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
