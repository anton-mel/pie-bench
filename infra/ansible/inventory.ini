# Fill in the password for each account, or switch to SSH keys and drop the
# ansible_password lines. Reach the Macs over Tailscale by their MagicDNS names.
# Each host's ansible_user is an account that exists on that machine.

[macs]
lius-macbook-pro-test.oarfish-sargas.ts.net      ansible_user=anton   mac_id=m5-max-128gb
macbook-pro-test-m5-max-64gb.oarfish-sargas.ts.net ansible_user=liuyang mac_id=m5-max-64gb
macbook-pro-test-m4-pro-48gb.oarfish-sargas.ts.net ansible_user=anton   mac_id=m4-pro-48gb
macbook-air-test-m3-16gb.oarfish-sargas.ts.net   ansible_user=liuyang mac_id=m3-16gb
macbook-air-test-m5-16gb.oarfish-sargas.ts.net   ansible_user=liuyang mac_id=m5-16gb
macbook-air-test-m2-16gb.oarfish-sargas.ts.net   ansible_user=anton   mac_id=m2-16gb

[macs:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password,publickey
